<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada Histórica: O Escape Room da Antiguidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #110a05;
            --color-stone: #2c241b;
            --color-gold: #d4af37;
            --color-clay: #b87333;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--color-bg);
            color: #fdf5e6;
            overflow-x: hidden;
            background-image: url('data:image/svg+xml;utf8,<svg opacity="0.03" xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23fff"/><path d="M0 0l100 100M100 0L0 100" stroke="%23000" stroke-width="1"/></svg>');
            user-select: none;
        }
        .font-ancient { font-family: 'Cinzel', serif; }
        
        /* Utilitários Visuais Compartilhados */
        .panel-stone {
            background: linear-gradient(145deg, #2a221a, #1e1812);
            border: 2px solid #3d3224;
            box-shadow: 8px 8px 16px #070402, -8px -8px 16px #1b1008;
            border-radius: 1.5rem;
        }
        .btn-gold {
            background: linear-gradient(145deg, #c49c2f, #a68428);
            color: #110a05;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .btn-gold:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-gold:active { transform: translateY(1px); }
        
        /* Efeitos Específicos das Fases */
        .flashlight-mask {
            clip-path: circle(12% at var(--mouse-x, 50%) var(--mouse-y, 50%));
            transition: clip-path 0.05s linear;
        }
        .card-memory { perspective: 1000px; cursor: pointer; }
        .card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .card-memory.flipped .card-inner { transform: rotateY(180deg); }
        .card-face { backface-visibility: hidden; position: absolute; inset: 0; }
        .card-back { transform: rotateY(180deg); }
        
        .shake-animation { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .pulse-glow { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        
        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { animation: slideIn 0.3s ease-out forwards, fadeOut 0.3s ease-in 3.5s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* Animações de Transição de Ecrã */
        .fade-enter { opacity: 0; transform: scale(0.95) translateY(20px); }
        .fade-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: opacity 0.5s ease-out, transform 0.5s ease-out; }
        
        /* Progress Bar de XP */
        .xp-bar-container { background: rgba(0,0,0,0.5); border-radius: 999px; overflow: hidden; border: 1px solid #d4af37; height: 10px; width: 120px;}
        .xp-bar-fill { background: linear-gradient(90deg, #d4af37, #fde08b); height: 100%; width: 0%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: #5c4731; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- CABEÇALHO COM SISTEMA DE XP -->
    <header class="w-full bg-black/80 backdrop-blur-md border-b border-amber-900/50 sticky top-0 z-50 shadow-[0_4px_20px_rgba(0,0,0,0.8)]">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="Game.goToHub()">
                <span class="text-2xl group-hover:rotate-12 transition-transform">🏺</span>
                <h1 class="font-ancient font-bold text-xl md:text-2xl text-amber-500 tracking-wider drop-shadow-md">Jornada Histórica</h1>
            </div>
            <div class="flex items-center gap-6">
                <!-- XP System UI -->
                <div class="hidden md:flex flex-col items-end">
                    <p class="text-[10px] text-amber-500 font-bold uppercase tracking-widest">Nível de Sabedoria</p>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-amber-200" id="xp-text">0 XP</span>
                        <div class="xp-bar-container">
                            <div class="xp-bar-fill" id="xp-bar"></div>
                        </div>
                    </div>
                </div>
                <button onclick="Game.goToHub()" class="px-5 py-2 text-xs font-bold rounded-lg border border-amber-600 bg-amber-900/60 hover:bg-amber-700/80 hover:text-white transition-all text-amber-200 shadow-md flex items-center gap-2">
                    <span>🧭</span> Mapa Geral
                </button>
            </div>
        </div>
    </header>

    <main id="app-container" class="flex-grow w-full max-w-7xl mx-auto p-4 md:p-8 relative">
        <!-- O conteúdo será injetado dinamicamente via JS aqui -->
    </main>

    <!-- Container de Notificações (Toasts) -->
    <div id="toast-container"></div>

    <!-- Modal Global de Vitória com Animação de XP -->
    <div id="victory-modal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="panel-stone p-8 max-w-lg w-full text-center relative border-amber-500 shadow-[0_0_80px_rgba(212,175,55,0.3)] transform scale-95 transition-transform duration-500" id="victory-panel">
            
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-24 h-24 bg-gradient-to-br from-amber-300 to-amber-600 rounded-full flex items-center justify-center border-4 border-[#110a05] shadow-[0_0_30px_#d4af37] animate-bounce">
                <span class="text-4xl" id="victory-icon">🏆</span>
            </div>

            <h2 class="font-ancient text-4xl text-gold mt-10 mb-2" id="victory-title">Fase Concluída!</h2>
            <div class="inline-block bg-amber-950/80 px-4 py-1 rounded-full text-amber-300 font-bold text-sm mb-6 border border-amber-700" id="victory-xp">
                +100 Pontos de Experiência
            </div>
            
            <div class="bg-black/60 p-5 rounded-2xl border border-amber-900/50 mb-8 text-left relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                <p class="text-xs text-amber-500 font-bold mb-2 uppercase tracking-wide">Pergaminho do Conhecimento:</p>
                <p class="text-sm text-amber-50 leading-relaxed font-medium" id="victory-learning"></p>
            </div>
            
            <button onclick="Game.closeVictoryModal()" class="w-full btn-gold py-4 rounded-xl text-base tracking-widest uppercase flex items-center justify-center gap-3">
                Continuar a Exploração <span>➔</span>
            </button>
        </div>
    </div>

    <script>
        /**
         * ENGINE PRINCIPAL DO JOGO
         */
        const Game = {
            state: {
                completedPhases: [],
                currentPhase: null,
                xp: 0,
                maxPhase: 14, // 14 Fases Normais. A 15ª é secreta.
                activeIntervals: []
            },
            
            registerInterval(id) {
                this.state.activeIntervals.push(id);
                return id;
            },

            clearAllIntervals() {
                this.state.activeIntervals.forEach(id => clearInterval(id));
                this.state.activeIntervals = [];
            },

            init() {
                this.goToHub();
            },

            addXP(amount) {
                this.state.xp += amount;
                const xpText = document.getElementById('xp-text');
                if (xpText) xpText.innerText = `${this.state.xp} XP`;
                
                const progressPct = Math.min((this.state.xp / (this.state.maxPhase * 100)) * 100, 100);
                const xpBar = document.getElementById('xp-bar');
                if (xpBar && xpBar.style) xpBar.style.width = `${progressPct}%`;
            },

            renderScreen(htmlContent, initCallback = null) {
                // Clear any running timers before rendering the new screen to prevent memory leaks
                this.clearAllIntervals();
                
                const container = document.getElementById('app-container');
                container.innerHTML = htmlContent;
                
                // Força reflow para animação rodar
                void container.offsetWidth;
                
                container.classList.add('fade-enter-active');
                setTimeout(() => container.classList.remove('fade-enter-active'), 500);
                
                if (initCallback) initCallback();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            goToHub() {
                this.state.currentPhase = null;
                const completedCount = this.state.completedPhases.filter(id => id <= 14).length;

                let gridHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">`;
                
                // Renderiza fases 1 a 14
                PhaseData.filter(p => p.id <= 14).forEach((phase, index) => {
                    const isCompleted = this.state.completedPhases.includes(phase.id);
                    
                    gridHTML += `
                        <div class="panel-stone p-5 relative group overflow-hidden transition-all duration-300 ${isCompleted ? 'border-amber-500/80 bg-[#251e16]' : 'hover:border-amber-600/50 hover:-translate-y-2 cursor-pointer'}" 
                             onclick="Game.startPhase(${phase.id})">
                            
                            ${isCompleted ? '<div class="absolute inset-0 bg-amber-900/10 z-0"></div><div class="absolute top-3 right-3 bg-amber-500 text-black w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold z-10">✓</div>' : ''}
                            
                            <div class="relative z-10">
                                <div class="text-4xl mb-4 bg-black/30 w-16 h-16 rounded-2xl flex items-center justify-center border border-amber-900/50 group-hover:scale-110 transition-transform">${phase.icon}</div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[10px] bg-amber-950 text-amber-500 px-2 py-0.5 rounded font-bold uppercase border border-amber-900">Fase ${phase.id}</span>
                                </div>
                                <h3 class="font-ancient text-lg text-amber-200 font-bold mb-2">${phase.title}</h3>
                                <p class="text-xs text-amber-100/60 line-clamp-2 leading-relaxed">${phase.desc}</p>
                            </div>
                            
                            ${isCompleted ? '' : `
                            <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-600 to-transparent transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500"></div>
                            `}
                        </div>
                    `;
                });
                gridHTML += `</div>`;

                // CÂMARA SECRETA (Se completou as 14)
                if (completedCount >= 14) {
                    const isBossBeaten = this.state.completedPhases.includes(15);
                    gridHTML += `
                        <div class="mt-12 mb-4 p-1 rounded-2xl ${isBossBeaten ? 'bg-green-600' : 'bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-600 pulse-glow'}">
                            <div class="bg-black p-8 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-stone-900 transition-colors text-center" onclick="Game.startPhase(15)">
                                <span class="text-6xl mb-3">${isBossBeaten ? '🎓' : '🗝️'}</span>
                                <h3 class="font-ancient text-3xl text-amber-400 font-bold mb-2 uppercase">${isBossBeaten ? 'Mestre da História' : 'A Câmara Secreta (Avaliação Final)'}</h3>
                                <p class="text-amber-100">${isBossBeaten ? 'Você desvendou todos os segredos do Escape Room!' : 'Você provou seu valor. O portal foi aberto. Entre para a Prova Final de Avaliação!'}</p>
                            </div>
                        </div>
                    `;
                }

                const hubHTML = `
                    <div class="text-center mb-12 relative">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 bg-amber-600/20 rounded-full blur-3xl -z-10"></div>
                        <h2 class="font-ancient text-4xl md:text-5xl text-amber-400 mb-4 font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">O Mapa do Tempo</h2>
                        <p class="text-amber-100 max-w-2xl mx-auto text-sm bg-black/40 p-4 rounded-xl border border-amber-900/50 backdrop-blur-sm">
                            Progresso da Jornada: <span class="font-bold text-amber-400">${completedCount} de 14 Fases Resolvidas</span><br>
                            Mergulhe nos mistérios das antigas civilizações. Ganhe XP e prove o seu conhecimento histórico!
                        </p>
                    </div>
                    ${gridHTML}
                `;
                this.renderScreen(hubHTML);
            },

            startPhase(id) {
                const phase = PhaseData.find(p => p.id === id);
                if (!phase) return;
                this.state.currentPhase = id;
                this.renderScreen(phase.template(), phase.init);
            },

            completePhase(learningText) {
                const phase = PhaseData.find(p => p.id === this.state.currentPhase);
                let xpGained = this.state.currentPhase === 15 ? 500 : 100;
                
                // Só ganha XP na primeira vez
                if (!this.state.completedPhases.includes(this.state.currentPhase)) {
                    this.state.completedPhases.push(this.state.currentPhase);
                    this.addXP(xpGained);
                }
                
                document.getElementById('victory-title').innerText = phase.id === 15 ? '🎓 Fuga Bem Sucedida!' : `Fase ${phase.id} Concluída!`;
                document.getElementById('victory-icon').innerText = phase.id === 15 ? '👑' : phase.icon;
                document.getElementById('victory-learning').innerText = learningText;
                document.getElementById('victory-xp').innerText = `+${xpGained} Pontos de Experiência`;
                
                const modal = document.getElementById('victory-modal');
                const panel = document.getElementById('victory-panel');
                
                if (modal && panel) {
                    modal.classList.remove('hidden');
                    void modal.offsetWidth;
                    
                    modal.classList.replace('opacity-0', 'opacity-100');
                    panel.classList.replace('scale-95', 'scale-100');
                }
                
                this.showToast('sucesso', 'Conquista Desbloqueada!', `+${xpGained} Pontos de Experiência`);
            },

            closeVictoryModal() {
                const modal = document.getElementById('victory-modal');
                const panel = document.getElementById('victory-panel');
                
                if (modal && panel) {
                    modal.classList.replace('opacity-100', 'opacity-0');
                    panel.classList.replace('scale-100', 'scale-95');
                    
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        this.goToHub();
                    }, 300);
                }
            },

            showToast(type, title, message) {
                const container = document.getElementById('toast-container');
                if (!container) return;

                const toast = document.createElement('div');
                const colors = type === 'erro' ? 'bg-red-950 border-red-700 text-red-200' : 'bg-[#182e18] border-green-600 text-green-200';
                const icon = type === 'erro' ? '❌' : '🌟';
                
                toast.className = `toast border-2 p-4 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] flex items-start gap-3 max-w-sm backdrop-blur-md ${colors}`;
                toast.innerHTML = `
                    <div class="bg-black/40 rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0">${icon}</div>
                    <div>
                        <h4 class="font-bold text-sm tracking-wide">${title}</h4>
                        <p class="text-xs opacity-90 mt-1">${message}</p>
                    </div>
                `;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            },
            
            shakeElement(elementId) {
                const el = document.getElementById(elementId);
                if (!el) return;
                el.classList.remove('shake-animation');
                void el.offsetWidth;
                el.classList.add('shake-animation');
            }
        };

        const PhaseData = [
            {
                id: 1, icon: '🏺', title: 'O Aprendiz de Escriba', desc: 'Simule o entalhe na argila úmida e valide o conhecimento mesopotâmico.',
                template: () => `
                    <div class="panel-stone p-6 flex flex-col items-center">
                        <div class="w-full flex justify-between items-center mb-6">
                            <h2 class="font-ancient text-2xl text-amber-400">1. Estúdio Cuneiforme</h2>
                            <span class="bg-amber-900/50 text-amber-300 px-3 py-1 rounded text-xs font-bold border border-amber-700">Mesopotâmia</span>
                        </div>
                        
                        <p class="text-sm text-amber-200 mb-4 text-center">Para avançar, faça pelo menos <strong class="text-white">50 marcações</strong> de estudo na argila húmida.</p>
                        
                        <div class="w-full max-w-2xl bg-[#966536] rounded-2xl p-2 relative shadow-[inset_0_0_20px_rgba(0,0,0,0.8)] border-4 border-[#593514]">
                            <canvas id="f1-canvas" class="w-full h-64 bg-amber-700/20 rounded-xl cursor-crosshair mix-blend-multiply touch-none"></canvas>
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10 text-black font-ancient text-5xl">▼ ◀ ▲ ▶</div>
                            
                            <!-- Barra de progresso de desenho -->
                            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-1/2 h-2 bg-black/50 rounded-full overflow-hidden">
                                <div id="f1-progress" class="h-full bg-green-500 w-0 transition-all duration-200"></div>
                            </div>
                        </div>
                        
                        <div class="mt-6 flex gap-4 w-full max-w-2xl">
                            <button onclick="F1.clear()" class="flex-1 py-3 bg-amber-900/50 hover:bg-amber-800 rounded-xl text-sm border border-amber-700 font-bold transition">🧹 Amassar Argila</button>
                            <button id="f1-btn-next" onclick="F1.answer()" class="flex-1 py-3 btn-gold rounded-xl text-sm opacity-50 pointer-events-none transition-all">Analisar Tábuas ➔</button>
                        </div>
                        
                        <div id="f1-quiz" class="hidden w-full max-w-2xl mt-8 p-6 bg-black/60 border-2 border-amber-700 rounded-2xl text-center shadow-2xl">
                            <h3 class="text-amber-500 font-bold mb-4 uppercase text-xs tracking-widest">Julgue a Afirmação</h3>
                            <p class="text-lg md:text-xl font-medium italic mb-8 text-amber-100">"Os escribas liam por puro lazer e utilizavam papéis para todos os seus registos comerciais."</p>
                            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                <button onclick="F1.check(false)" class="flex-1 px-6 py-4 bg-red-950/80 rounded-xl font-bold border-2 border-red-700 hover:bg-red-900 transition-colors shadow-lg">❌ MENTIRA</button>
                                <button onclick="F1.check(true)" class="flex-1 px-6 py-4 bg-green-950/80 rounded-xl font-bold border-2 border-green-700 hover:bg-green-900 transition-colors shadow-lg">✔️ VERDADE</button>
                            </div>
                        </div>
                    </div>
                `,
                init: () => {
                    window.F1 = {
                        ctx: null, drawing: false, marks: 0,
                        setup() {
                            const canvas = document.getElementById('f1-canvas');
                            if(!canvas) return;
                            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                            this.ctx = canvas.getContext('2d');
                            this.ctx.fillStyle = 'rgba(150, 101, 54, 0.1)'; this.ctx.fillRect(0,0,canvas.width,canvas.height);
                            
                            const drawHandler = (e) => { 
                                this.drawing = true; 
                                e.preventDefault();
                                this.draw(e.touches ? e.touches[0] : e); 
                            };
                            const moveHandler = (e) => {
                                if(!this.drawing) return;
                                e.preventDefault();
                                this.draw(e.touches ? e.touches[0] : e);
                            };
                            
                            canvas.onmousedown = drawHandler;
                            canvas.ontouchstart = drawHandler;
                            canvas.onmousemove = moveHandler;
                            canvas.ontouchmove = moveHandler;
                            
                            window.onmouseup = () => this.drawing = false;
                            window.ontouchend = () => this.drawing = false;
                        },
                        draw(e) {
                            if(!this.drawing) return;
                            const canvas = document.getElementById('f1-canvas');
                            if(!canvas) return;
                            const rect = canvas.getBoundingClientRect();
                            const x = e.clientX - rect.left, y = e.clientY - rect.top;
                            this.ctx.fillStyle = 'rgba(40, 20, 5, 0.8)';
                            this.ctx.beginPath(); this.ctx.arc(x, y, 4, 0, Math.PI*2); this.ctx.fill();
                            
                            this.marks++;
                            const pct = Math.min((this.marks / 50) * 100, 100);
                            const progress = document.getElementById('f1-progress');
                            if(progress && progress.style) progress.style.width = pct + '%';
                            
                            if (this.marks >= 50) {
                                const btn = document.getElementById('f1-btn-next');
                                if(btn) {
                                    btn.classList.remove('opacity-50', 'pointer-events-none');
                                    btn.classList.add('pulse-glow');
                                }
                            }
                        },
                        clear() { 
                            this.marks = 0; 
                            const progress = document.getElementById('f1-progress');
                            if(progress && progress.style) progress.style.width = '0%'; 
                            const btn = document.getElementById('f1-btn-next');
                            if(btn) {
                                btn.classList.add('opacity-50', 'pointer-events-none'); 
                                btn.classList.remove('pulse-glow'); 
                            }
                            this.setup(); 
                        },
                        answer() { 
                            const quiz = document.getElementById('f1-quiz');
                            if(quiz) {
                                quiz.classList.remove('hidden'); 
                                quiz.scrollIntoView({behavior: 'smooth'});
                            }
                        },
                        check(ans) {
                            if(!ans) Game.completePhase("A escrita surgiu da necessidade económica. Os escribas gravavam em argila húmida (cuneiforme), pois o papel não existia na Mesopotâmia.");
                            else Game.showToast('erro', 'Análise Incorreta', 'Lembre-se: o papel não existia e a leitura era estritamente administrativa.');
                        }
                    };
                    setTimeout(() => F1.setup(), 100);
                }
            },
            
            {
                id: 2, icon: '👁️', title: 'Decifrando Seti I', desc: 'Clique nos hieróglifos para extrair os seus significados ocultos.',
                template: () => `
                    <div class="panel-stone p-6" id="f2-container">
                        <h2 class="font-ancient text-2xl text-amber-400 mb-2 text-center">2. Mural da Tumba</h2>
                        <p class="text-sm text-center mb-6 text-amber-100/80">A escrita egípcia representa ideias e sons. Encontre e <strong class="text-amber-400">traduza 3 símbolos</strong> sagrados clicando neles.</p>
                        
                        <div class="grid grid-cols-4 md:grid-cols-6 gap-3 max-w-2xl mx-auto bg-amber-50 p-5 rounded-2xl border-8 border-[#c2b280] shadow-[inset_0_5px_20px_rgba(0,0,0,0.5)]">

                                    setTimeout(() => Game.startPhase(15), 2500);
                                } else {
                                    Game.showToast('erro', 'Resposta Incorreta!', 'Os deuses exigem mais sabedoria. Você perdeu uma vida.');
                                    // Deixa tentar de novo
                                    setTimeout(() => {
                                        if(optionsContainer) {
                                            const buttons = optionsContainer.querySelectorAll('button');
                                            buttons.forEach(b => {
                                                b.style.pointerEvents = 'auto';
                                                b.classList.remove('border-red-600', 'bg-red-900/60');
                                                b.classList.add('border-stone-700', 'bg-stone-900/80');
                                            });
                                        }
                                    }, 1500);
                                }
                            }
                        },

                        updateHearts() {
                            let heartsHTML = '';
                            for(let i=0; i<3; i++) {
                                heartsHTML += `<span>${i < this.lives ? '❤️' : '🖤'}</span>`;
                            }
                            const heartsContainer = document.getElementById('f15-hearts');
                            if(heartsContainer) heartsContainer.innerHTML = heartsHTML;
                        }
                    };
                    F15.renderQ();
                }
            }
        ];

        /* INICIALIZAÇÃO AUTOMÁTICA AO CARREGAR O DOM */
        window.onload = () => {
            Game.init();
        };
    </script>
    
    <!-- Animação extra usada na Fase 15 -->
    <style>
        .animate-fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
